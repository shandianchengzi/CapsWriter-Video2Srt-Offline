name: Build CapsWriter Lite for Windows
on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-capswriter-lite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Verify source and logic tests
        shell: pwsh
        run: |
          python -m compileall -q desktop
          $env:PYTHONPATH = "desktop"
          python -m unittest discover -s desktop/tests -v

      - name: Build tray application (model files excluded)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name CapsWriterLite `
            --icon assets/icon.ico `
            --paths desktop `
            --paths . `
            --hidden-import util.chinese_itn `
            --hidden-import util.format_tools `
            --collect-all sherpa_onnx `
            --collect-all funasr_onnx `
            --collect-all onnxruntime `
            --collect-all jieba `
            --collect-all uiautomation `
            --hidden-import kaldi_native_fbank `
            desktop/app.py
          if (!(Test-Path dist/CapsWriterLite/CapsWriterLite.exe)) {
            throw "Windows EXE was not produced"
          }

      - name: Pack Windows executable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CapsWriterLite -DestinationPath CapsWriterLite-v0.2.0-win64.zip -Force

      - name: Upload action artifact
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriterLite-v0.2.0-win64
          path: CapsWriterLite-v0.2.0-win64.zip
          if-no-files-found: error

      - name: Publish prerelease
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: master
          name: CapsWriter Lite v0.2.0 (Windows)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: CapsWriterLite-v0.2.0-win64.zip
          body: |
            Windows 托盘语音输入（预览版），使用原版 Paraformer + CT-Transformer 大模型。
            程序不包含模型。首次启动可直接选择旧版 models 文件夹，
            或下载安装 Release 1 的原版模型包（约 1.18 GB）。
            模型只在后台进程启动时加载一次，随后常驻内存。
