name: Windows installer and differential updates
on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'package.json'
      - '.github/workflows/build-capswriter-lite.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capswriter-lite-windows-release
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Test Python source and logic
        run: |
          python -m compileall -q desktop
          $env:PYTHONPATH = "desktop"
          python -m unittest discover -s desktop/tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }

      - name: Install electron-builder and updater
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "NPM install failed" }
          npm run test:launcher
          if ($LASTEXITCODE -ne 0) { throw "Launcher tests failed" }

      - name: Build resident voice engine without model weights
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name CapsWriterLite `
            --icon assets/icon.ico `
            --paths desktop `
            --paths . `
            --collect-all sherpa_onnx `
            --collect-all funasr_onnx `
            --collect-all onnxruntime `
            --collect-all jieba `
            --collect-all uiautomation `
            --collect-all pypinyin `
            --add-data "hot-zh.txt;legacy" `
            --add-data "hot-en.txt;legacy" `
            --add-data "hot-rule.txt;legacy" `
            --add-data "keywords.txt;legacy" `
            --hidden-import util.chinese_itn `
            --hidden-import util.format_tools `
            --hidden-import kaldi_native_fbank `
            desktop/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path dist/CapsWriterLite/CapsWriterLite.exe)) { throw "Voice engine missing" }

      - name: Prepare 256px Windows installer icon
        run: |
          python -c "from PIL import Image; i=Image.open('assets/icon.ico').convert('RGBA').resize((256,256),Image.Resampling.LANCZOS); i.save('desktop/launcher/win-icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])"
          python -c "from PIL import Image; i=Image.open('desktop/launcher/win-icon.ico'); assert (256,256) in i.ico.sizes(), 'Installer icon lacks 256x256'"

      - name: Build NSIS setup and differential metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          $version = node -p "require('./package.json').version"
          $installer = "release-dist/CapsWriter-Lite-$version-x64-Setup.exe"
          $blockmap = "$installer.blockmap"
          if (!(Test-Path $installer)) { throw "NSIS installer missing" }
          if (!(Test-Path $blockmap)) { throw "NSIS blockmap missing" }
          if (!(Test-Path release-dist/latest.yml)) { throw "Update feed missing" }
          Write-Output "Installer: $((Get-Item $installer).Length) bytes"
          Write-Output "Blockmap: $((Get-Item $blockmap).Length) bytes"
          Get-Content release-dist/latest.yml

      - name: Verify v0.3.1 to v0.3.2 differential reconstruction
        run: |
          $version = node -p "require('./package.json').version"
          $old = "https://github.com/shandianchengzi/CapsWriter-Video2Srt-Offline/releases/download/v0.3.1/CapsWriter-Lite-0.3.1-x64-Setup.exe"
          $previous = Join-Path $env:RUNNER_TEMP 'capswriter-previous.exe'
          $map = Join-Path $env:RUNNER_TEMP 'capswriter-previous.blockmap'
          Invoke-WebRequest $old -OutFile $previous
          Invoke-WebRequest "$old.blockmap" -OutFile $map
          node desktop/launcher/differential-benchmark.cjs $previous $map "release-dist/CapsWriter-Lite-$version-x64-Setup.exe" "release-dist/CapsWriter-Lite-$version-x64-Setup.exe.blockmap" "release-dist/update-performance.json"
          if ($LASTEXITCODE -ne 0) { throw "Actual blockmap differential reconstruction failed" }
          $metrics = Get-Content release-dist/update-performance.json | ConvertFrom-Json
          if (!$metrics.sha512Verified) { throw "Differential output SHA-512 verification failed" }
          Write-Output "Difference download: $($metrics.downloadPercent)% of full installer"

      - name: Validate real NSIS installation
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Join-Path $PWD "release-dist/CapsWriter-Lite-$version-x64-Setup.exe"
          $destination = Join-Path $env:RUNNER_TEMP "capswriter-lite-installed"
          $process = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination/CapsWriter Lite.exe")) { throw "Installed launcher missing" }
          if (!(Test-Path "$destination/resources/app-update.yml")) { throw "Updater configuration missing" }
          if (!(Test-Path "$destination/resources/voice/CapsWriterLite/CapsWriterLite.exe")) {
            throw "Embedded voice engine missing"
          }
          if (!(Test-Path "$destination/resources/app.asar")) { throw "Electron launcher missing" }
          # The original model directory belongs to LOCALAPPDATA and must not be in NSIS.
          if (Test-Path "$destination/resources/voice/CapsWriterLite/models") {
            throw "Large model must not be bundled with the app"
          }
          Write-Output "NSIS install verified: $destination"

      - name: Upload Windows build and blockmap
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriter-Lite-Setup-v0.3.2
          path: |
            release-dist/*-Setup.exe
            release-dist/*.blockmap
            release-dist/latest.yml
            release-dist/update-performance.json
          if-no-files-found: error

      - name: Publish installer release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2
          target_commitish: master
          name: CapsWriter Lite v0.3.2 - Windows Installer and Differential Update
          prerelease: false
          make_latest: true
          files: |
            release-dist/*-Setup.exe
            release-dist/*.blockmap
            release-dist/latest.yml
            release-dist/update-performance.json
          body: |
            Windows EXE 安装版，支持 NSIS 安装、托盘常驻、GitHub 自动更新和 blockmap 差分下载。
            继续使用原版 Paraformer + CT-Transformer 大模型（不内置模型；下载一次后永久保留）。
            新增 UI 快捷键、录音/文字保存、旧版词库管理，使用 v0.3.1 -> v0.3.2 差分验证。\n            首次从旧 v0.2.0 ZIP 版升级必须完整安装；后续安装版间可差分更新，
            差分不可用时回退完整包，并支持断点续传。
            模型、热词、Quicker 设置存放于 %LOCALAPPDATA%\CapsWriterLite，与安装目录分离。
